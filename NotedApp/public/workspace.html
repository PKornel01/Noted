<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace – Noted!</title>
    <link rel="stylesheet" href="workspace.css">
    <link rel="stylesheet" href="kanbanModule.css">
    <link rel="stylesheet" href="flowchartModule.css">
    <link rel="stylesheet" href="noteModule.css">
    <link rel="stylesheet" href="pictureModule.css">
</head>
<body>
    <a id="workspace-brand" href="/homepage.html" aria-label="Back to homepage">
        <span>Noted!</span>
        <span id="workspace-home-indicator" aria-hidden="true">&lt;</span>
    </a>

    <div id="sidebar">
        <button id="kanbanmaker"><img src="Kanban-icon.png" id="kanban-img"><span>Kanban</span></button>
        <button id="flowchartmaker"><img src="Flowchart-icon.png" id="flowchart-img"><span>Flowchart</span></button>
        <button id="notemaker" type="button"><img src="Note-icon.png" id="note-img" alt=""><span>Note</span></button>
        <button id="picturemaker" type="button"><img src="Picture-icon.png" id="picture-img" alt=""><span>Picture</span></button>
    </div>

    <div id="sheet">
        <div id="shared-pane" class="module-pane">
            <div id="shared-canvas" class="module-canvas"></div>
        </div>
    </div>

    <script src="workspace.js"></script>
    <script src="kanbanModule.js"></script>
    <script src="flowchartModule.js"></script>
    <script src="noteModule.js"></script>
    <script src="pictureModule.js"></script>
</body>
</html>
