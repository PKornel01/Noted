<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homepage.css">
    <title>Your page – Noted!</title>

</head>
<body>
    <nav class="glass-nav">
        <div class="nav-logo"><a href="index.html">Noted!</a></div>
        <div class="nav-links">
            <a href="#">Refresh</a>
            <a href="#">Settings</a>
        </div>

        <div class="profile-wrapper">
            <button class="profile-btn" id="profileBtn">
                <img src="" alt="Profile" class="avatar-img" id="avatarImg">
                <span class="navbar-user-name" id="navbarUserName"></span>
            </button>

            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-avatar">
                    <img src="" alt="Profile" id="dropdownAvatarImg">
                    <button id="changePicBtn" type="button">Change photo</button>
                </div>
                <input type="file" id="profilePictureInput" accept="image/*" hidden>
                <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
                <button id="logoutBtn">Log out</button>
            </div>
        </div>
    </nav>

    <div class="projects-box">
        <div class="projects-header">
            <h1 id="title">Your Projects</h1>
            <button id="create-btn">
                <span id="plus-icon">+</span>
                <span id="create-text">Create new</span>
            </button>
        </div>

        <div id="projects-container">
            <P id="projects-notice">Your projects will appear here</P>
        </div>
    </div>

    <dialog id="delete-project-dialog" class="delete-project-dialog" aria-labelledby="delete-project-heading" aria-describedby="delete-project-description">
        <div class="delete-dialog-icon" aria-hidden="true">!</div>
        <h2 id="delete-project-heading">Delete project?</h2>
        <p id="delete-project-description">
            Are you sure you want to delete <strong id="delete-project-name"></strong>? This action can't be undone.
        </p>
        <div class="delete-dialog-actions">
            <button id="cancel-project-delete" class="delete-dialog-cancel" type="button" autofocus>Cancel</button>
            <button id="confirm-project-delete" class="delete-dialog-confirm" type="button">Delete project</button>
        </div>
    </dialog>

    <script src="homepage.js"></script>
</body>
</html>
