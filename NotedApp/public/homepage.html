<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hompage.css">
    <title>Document</title>

</head>
<body>
    <nav class="glass-nav">
        <div class="nav-logo">Noted!</div>
        <div class="nav-links">
            <a href="#">Refresh</a>
            <a href="#">Settings</a>
        </div>

        <div class="profile-wrapper">
            <button class="profile-btn" id="profileBtn">
                <img src="" alt="Profile" class="avatar-img" id="avatarImg">
            </button>

            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-avatar">
                    <img src="" alt="Profile" id="dropdownAvatarImg">
                    <button id="changePicBtn">Change photo</button>
                </div>
                 
                <input type="text" id="nameInput" placeholder="Your name">

                <button id="logoutBtn">Log out</button>
            </div>
        </div>
    </nav>

    <div class="projects-box">
        <div class="projects-header">
            <h1 id="title">Your Projects</h1>
            <button id="create-btn">
                <span id="plus-icon">+</span>
                <span id="create-text">Create new</span>
            </button>
        </div>
        <div class="projects-box" id="projects-container">
            <P id="projects-notice">Your projects will appear here</P>
        </div>


    </div>

    <script src="homepage.js"></script>
</body>
</html>
